<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Brosse pour chien" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Manche -->
  <rect x="60" y="125" width="150" height="50" rx="25" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <rect x="80" y="145" width="90" height="8" rx="4" fill="#000000" opacity="0.2"/>
  <!-- Tête de la brosse -->
  <rect x="195" y="85" width="150" height="130" rx="22" fill="#000000"/>
  <!-- Picots -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="220" y1="105" x2="220" y2="195"/>
    <line x1="245" y1="105" x2="245" y2="195"/>
    <line x1="270" y1="105" x2="270" y2="195"/>
    <line x1="295" y1="105" x2="295" y2="195"/>
    <line x1="320" y1="105" x2="320" y2="195"/>
  </g>
  <!-- Pointes arrondies -->
  <g fill="#ffffff">
    <circle cx="220" cy="195" r="6"/>
    <circle cx="245" cy="195" r="6"/>
    <circle cx="270" cy="195" r="6"/>
    <circle cx="295" cy="195" r="6"/>
    <circle cx="320" cy="195" r="6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
